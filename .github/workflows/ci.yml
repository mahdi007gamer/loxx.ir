name: LOXX CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Prepare API env
        run: cp apps/api/.env.example apps/api/.env
      - run: npm run db:generate -w @loxx/api
      - run: npm test
      - run: npm run build
